<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kayıp Rıhtım</title>
<style>
:root {
  --paper: #f6f0e4;
  --surface: #fbf7ef;
  --ink: #302c27;
  --muted: #706657;
  --accent: #79382f;
  --line: #d9cebd;
  --soft: #eae1d2;
  --green: #4c5e4e;
  --size: 21px;
}

html[data-theme="day"] {
  --paper: #fafafa;
  --surface: #fff;
  --ink: #282b2b;
  --muted: #616666;
  --accent: #783b35;
  --line: #dcdedd;
  --soft: #edf0ed;
  --green: #405c49;
}

html[data-theme="night"] {
  --paper: #202321;
  --surface: #272b28;
  --ink: #eee7da;
  --muted: #b9b5aa;
  --accent: #e4aa96;
  --line: #4a5049;
  --soft: #343a34;
  --green: #b5c8ae;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: Arial, Helvetica, sans-serif;
}

a { color: inherit; text-decoration: none; }

button {
  font: inherit;
  color: inherit;
  cursor: pointer;
}

button:disabled {
  opacity: .4;
  cursor: default;
}

[hidden] { display: none !important; }

.kapsayici {
  max-width: 1180px;
  margin: auto;
  padding: 0 48px;
}

.ust-serit { border-bottom: 1px solid var(--line); }

.ust-serit-ici {
  min-height: 98px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}

.marka-adi {
  display: block;
  font: 26px Georgia, serif;
  letter-spacing: -.6px;
}

.marka-aciklamasi {
  display: block;
  font-size: 9px;
  letter-spacing: 2.2px;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 5px;
}

.tema-grubu {
  display: flex;
  align-items: center;
  gap: 3px;
  padding: 4px;
  border: 1px solid var(--line);
  border-radius: 40px;
}

.tema-dugmesi {
  display: flex;
  align-items: center;
  gap: 7px;
  border: 0;
  background: transparent;
  color: var(--muted);
  border-radius: 30px;
  padding: 9px 13px;
  font-size: 12px;
}

.tema-dugmesi[aria-pressed="true"] {
  background: var(--ink);
  color: var(--paper);
}

.tema-noktasi {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  border: 1px solid currentColor;
}

.tema-dugmesi[data-value="day"] .tema-noktasi { background: #fff; }
.tema-dugmesi[data-value="sepia"] .tema-noktasi { background: #ceb38b; }
.tema-dugmesi[data-value="night"] .tema-noktasi { background: #515f55; }

.giris { padding: 70px 0 55px; }

.giris h1 {
  font: normal clamp(56px, 6.8vw, 86px)/1.04 Georgia, serif;
  letter-spacing: -3px;
  margin: 25px 0;
}

.giris h1 em {
  font-weight: normal;
  color: var(--accent);
}

.giris-metni {
  font-size: 15px;
  line-height: 1.8;
  color: var(--muted);
  max-width: 430px;
  margin: 22px 0 0;
}

.masal-listesi {
  border-top: 1px solid var(--ink);
  display: grid;
  grid-template-columns: 1fr 1fr;
  column-gap: 40px;
}

.masal-karti {
  display: grid;
  grid-template-columns: 35px 1fr;
  gap: 16px;
  padding: 30px 12px 31px 0;
  border-bottom: 1px solid var(--line);
  min-height: 201px;
  transition: background .18s, box-shadow .18s, transform .18s;
}

.masal-karti:hover {
  background: var(--surface);
  box-shadow: 0 9px 20px -17px var(--ink);
  transform: translateY(-2px);
}

.kart-numarasi {
  font: italic 15px Georgia, serif;
  color: var(--muted);
  padding-top: 5px;
}

.kart-temasi {
  font-size: 9px;
  letter-spacing: 1.4px;
  color: var(--green);
  text-transform: uppercase;
}

.masal-karti h3 {
  font: normal 29px/1.18 Georgia, serif;
  letter-spacing: -.7px;
  margin: 10px 0;
}

.kart-aciklamasi {
  font-size: 13px;
  line-height: 1.7;
  color: var(--muted);
  max-width: 340px;
  margin: 0;
}

.kart-oku {
  display: inline-block;
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-top: 17px;
  color: var(--accent);
}

.secki-sonu {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 12px;
  padding: 35px 0 65px;
}

.secki-sonu p {
  font: italic 18px Georgia, serif;
  margin: 0;
}

.secki-sonu span {
  font-size: 11px;
  color: var(--muted);
}

.okuma-ust-alani {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  padding: 24px 0;
  border-bottom: 1px solid var(--line);
}

.geri-baglantisi {
  font-size: 12px;
  color: var(--muted);
}

.geri-baglantisi:hover { color: var(--accent); }

.masal-sirasi {
  font-size: 10px;
  letter-spacing: 1.6px;
  text-transform: uppercase;
  color: var(--muted);
}

.okuma-ayarlari {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 11px;
  padding-top: 28px;
  font-size: 11px;
  color: var(--muted);
}

.boyut-kontrolleri {
  display: flex;
  align-items: center;
  gap: 8px;
}

.boyut-dugmesi {
  width: 37px;
  height: 35px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: transparent;
}

.boyut-dugmesi:hover:enabled { background: var(--soft); }

.boyut-dugmesi.buyuk { font-size: 17px; }

.okuma-ayarlari output {
  min-width: 42px;
  text-align: center;
}

.okuma-alani {
  max-width: 740px;
  margin: 0 auto;
  padding: 45px 0 65px;
}

.masal-baslik-alani {
  text-align: center;
  margin-bottom: 42px;
}

.ust-baslik {
  text-transform: uppercase;
  letter-spacing: 2.5px;
  font-size: 9px;
  font-weight: 600;
  color: var(--accent);
}

.masal-baslik-alani h1 {
  font: normal clamp(40px, 5vw, 60px)/1.1 Georgia, serif;
  letter-spacing: -1.6px;
  margin: 19px 0;
}

.masal-giris-metni {
  font: italic 19px/1.6 Georgia, serif;
  max-width: 570px;
  margin: 0 auto;
  color: var(--muted);
}

.kisa-cizgi {
  width: 45px;
  border: 0;
  border-top: 1px solid var(--accent);
  margin: 28px auto 18px;
}

.masal-metni {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: var(--size);
  line-height: 1.72;
  overflow-wrap: break-word;
  display: flow-root;
}

.masal-metni p { margin: 0 0 1.3em; }

.masal-metni p:first-child::first-letter {
  float: left;
  font-size: 3.3em;
  line-height: .85;
  margin: .08em .12em 0 0;
  color: var(--accent);
}

.masal-sonu {
  text-align: center;
  font-size: 20px;
  color: var(--accent);
  margin: 27px 0;
}

.kaynak-bilgisi {
  border-top: 1px solid var(--line);
  padding-top: 22px;
  font-size: 11px;
  line-height: 1.8;
  color: var(--muted);
}

.kaynak-bilgisi summary {
  cursor: pointer;
  color: var(--ink);
  padding: 6px 0;
}

.kaynak-bilgisi a {
  color: var(--accent);
  text-decoration: underline;
}

.kaynak-bilgisi p { margin: 12px 0; }

.masal-gezinme {
  display: flex;
  justify-content: space-between;
  gap: 24px;
  border-top: 1px solid var(--line);
  margin-top: 30px;
  padding-top: 24px;
}

.masal-gezinme a {
  max-width: 46%;
  font: 17px/1.4 Georgia, serif;
}

.masal-gezinme small {
  display: block;
  font: 9px Arial, sans-serif;
  letter-spacing: 1.5px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 8px;
}

.masal-gezinme .sonraki {
  text-align: right;
  margin-left: auto;
}

@media (max-width: 520px) {
  .kapsayici { padding: 0 22px; }

  .ust-serit-ici {
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    padding: 19px 0 17px;
  }

  .marka { margin-right: auto; }

  .tema-dugmesi {
    padding: 8px;
    font-size: 10px;
  }

  .tema-noktasi { display: none; }

  .giris { padding: 41px 0 33px; }

  .masal-listesi { grid-template-columns: 1fr; }

  .masal-karti {
    grid-template-columns: 28px 1fr;
    gap: 11px;
    min-height: 0;
    padding: 25px 3px 25px 0;
  }
}
</style>
</head>
<body>
<header class="ust-serit">
  <div class="kapsayici ust-serit-ici">
    <a class="marka" href="#">
      <span class="marka-adi">Kayıp Rıhtım</span>
      <span class="marka-aciklamasi">Türk masalları seçkisi</span>
    </a>
    <div class="tema-grubu">
      <button class="tema-dugmesi" data-value="day" aria-pressed="false"><span class="tema-noktasi"></span>Gündüz</button>
      <button class="tema-dugmesi" data-value="sepia" aria-pressed="true"><span class="tema-noktasi"></span>Sepya</button>
      <button class="tema-dugmesi" data-value="night" aria-pressed="false"><span class="tema-noktasi"></span>Gece</button>
    </div>
  </div>
</header>

<main class="kapsayici">
  <section id="collection">
    <div class="giris">
      <h1>Bir varmış,<br><em>bir yokmuş.</em></h1>
      <p class="giris-metni">Kimi bir yolculuk, kimi bir tutam bilgelik.</p>
    </div>
    <div class="masal-listesi" id="story-grid"></div>
    <div class="secki-sonu">
      <p>Gökten üç elma düşmüş…</p>
      <span>Biri anlatana, biri dinleyene, biri de okuyana.</span>
    </div>
  </section>

  <section id="reader" hidden>
    <div class="okuma-ust-alani">
      <a class="geri-baglantisi" href="#">← Bütün masallar</a>
      <span id="reader-position" class="masal-sirasi"></span>
    </div>
    <div class="okuma-ayarlari">
      <span>Yazı boyutu</span>
      <div class="boyut-kontrolleri">
        <button id="smaller" class="boyut-dugmesi">A−</button>
        <output id="font-size">21 px</output>
        <button id="larger" class="boyut-dugmesi buyuk">A+</button>
      </div>
    </div>
    <article class="okuma-alani">
      <header class="masal-baslik-alani">
        <span class="ust-baslik" id="story-theme"></span>
        <h1 id="story-title"></h1>
        <p id="story-intro" class="masal-giris-metni"></p>
        <hr class="kisa-cizgi">
      </header>
      <div id="story-body" class="masal-metni"></div>
      <div class="masal-sonu">❧</div>
      <details class="kaynak-bilgisi">
        <summary>Yararlanılan kaynak</summary>
        <p id="source-note"></p>
        <a id="source-link" target="_blank"></a>
      </details>
      <nav class="masal-gezinme" id="reader-nav"></nav>
    </article>
  </section>

</main>

      "“Ah benim halim ne olacak?” diye dövünür, karnı da büyümüş, içi lombur lombur edermiş. “Bütün bunlar üvey anamın tuzağı…” der kızcağız, ne edeceğine şaşırmış, başlar dağdan aşağı inmeye… Bir dere kenarına varır. Şurada bir abdest alayım, Allah'a sığınayım. Bakalım Allah ne gösterir,” der. Dereye gelmeye… Derenin içinden de başka bir ses buna cevap vermiş… Bir de ne görsün, ağzından kağış kağış, bir yılanla yavruları çıkmasın mı?",
      "Kızcağız hafifler, ferahlar. Ama dağ başında, yapayalnız kalmış… Kalbi mahzun, düşüne düşüne bir yol tutturur, gider gider…",
      "Ortalık kararmaya başlamış… Uzaktan bir ışık görür: “Şuraya gideyim, belki beni alırlar,” der. Varır o ışığın olduğu eve, kapıyı çalar. Açarlar. Meğer orası Kırk-Haramiler'in evi imiş. Bunu gören Haramiler:",
      "“Kız senin burada işin ne? Derler. Kız da başından geçenleri anlatır.",
      "“Ah, der, beni babam böyle böyle, dağda bıraktı. Allah rızası için, alın beni içeri, size sığındım, bu gece misafir edin.”",
      "Kırk Haramiler bakarlar ki, dünya güzeli gibi bir kız, yüzüne bakmaya kıyılmaz… Kıza derler ki:",
      "“Sen şurada otur, biz bir düşünelim.”",
      "Kırkı da bir odaya girerler, başlarlar müzakereye.",
      "“Birimiz alsak, birimiz ister; birimiz alsak birimiz ister… Bize sığınmış namuslu bir kız, başka türlü de edemeyiz. En iyisi bunu kırkımız kardeş edinelim,” derler. Gelirler:",
      "“Kız, derler, sen bizim dünya ahiret kardeşimiz ol. Biz getirelim sen pişir. Otur, keyfine bak…”",
      "“Peki,” der kız da. Artık bunlar kardeşlerini öyle severler, öyle severlermiş ki, dünyada, üstüne toz konduramazlarmış. O da onları severmiş…",
      "Kırk-Haramilerin evinde oturmakta olsun… Biz gelelim analığa…",
      "Ay doğmuş, ayın on beşi… Kadın çıkmış ayın karşısına…",
      "“Ayım, ayım,",
      "Sen mi güzel ben mi güzel?",
      "Ay da derki oradan:",
      "“Ne sen güzel, ne ben güzel,",
      "İlle Nardaniye Hanım güzel.",
      "(Kızın adı Nardaniye Hanım imiş…) Bunu duyan kadın.",
      "“Eyvah, der, kaltak ölmemiş. Bu iş gizli kalmaz, meydana çıkar. Şimdi ben ne yapayım?",
      "Hemen kocasına gider. “Aman kocacığım, der, yavrucağızı nerelere bırakmıştın?",
      "Rüyama girdi… Aç mıdır, susuz mudur? Gideyim arayayım.”",
      "Adamcağızın da o gün, bugün, iki gözü iki çeşme, kızının derdinden erimiş bitmiş, dünyadan elini eteğini çekmiş… Karısının bu düşüncesine içinden sevinir. Gider kadına bıraktığı dağı gösterir.",
      "Kadın bir sepet kiraz alır, hepsini zehirler. Takar koluna sepeti. Kocasının gösterdiği yerden aşağıya doğru yürür. Gider, gider, uzakta bir ev görür. “Mutlaka buraya sığınmıştır,” der. Ama kendisini bir başka kıyafete sokmuş: Bir ferace giymiş, bir gözü açık öteki örtülü… Yürür eve doğru… Kız da işini bitirmiş, gelir, Kiraz satıyorum, kiraz… “ diye kapının önüne. Kız da:",
      "“Kiraz alayım da, pencerenin önünde oturayım,” der.",
      "Hemen çıkar, yarım okka kiraz alır… Oturur pencerenin önüne, kirazlarını yiyecek… Penceresinin yukarısında da kırk tane kuş varmış, kafeste, onlarla eğlenirmiş. Kuşlar başlar: “Cik cik, cik cik cik…” diye kiraz istemeye. Bir tane ona vereyim, bir tane ona derken sepette kiraz biter. Kıza bir tane bile kalmamış. Kız bir de bakar ki, kirazı yiyen kuş ölüyor, yiyen ölüyor… Oturur pencerenin önüne, iki gözü iki çeşme ağlar, kızcağız. Kuşlarını pek severmiş… Akşam olur, kardeşleri gelir.",
      "“Ne ağlıyorsun kardeş,” derler.",

      "Ertesi gün evvelkilerden güzel kırk tane kuş getirirler, kafeslere koyarlar.",
      "Ardından bir ay geçer, yeni ay doğar. Analık çıkar ayın karşısına: “Ayım, ayım,",

      "“Ah, kaltak kız, ölmemiş…” diye, bu sefer gider kadın, bir kâğıt sakız alır. Sakızı zehirler. Gene varır Haramilerin evinin önüne: “Sakız satarım, sakız satarım…” diye geçmeye. Kız kendi kendine: “Bu yenecek şey değil ya… Alayım…” der, alır kadından sakızı, kuşlar gene başlar ötüşmeye: “Cik, cik, cik, bana, bana…” diye. Kız der ki:",
      "“Durun, çiğneyeyim de öyle vereyim.”",
      "Sakızı atar ağzına, bir iki çiğnerken, düşer serilir olduğu yere.",
      "Akşam olur, kardeşleri gelir bakarlar ki, kız serili yatıyor.",
      "“Eyvah, kardeşimiz ölmüş. Biz nasıl dayanalım bunun acısına. Nasıl gömelim topraklara?” diye ağlaşırlar. Bir tabut yaptırırlar. İçine kızı koyarlar. Artık nereye giderlerse, bu tabutu taşırlarmış.",
      "Bir gün bunlara bir padişahın oğlu rastgelmiş… Der ki şehzade:",

      "“Ah, sorma, derler Kırk-Haramiler, biz kırk tane kardeşiz, bir tek bacımız vardı. O bacımız öldü. Kıyamıyoruz toprağa gömmeye. Böyle taşıyoruz.”",
      "Bunun üzerine Şehzade der ki:",

      "Şehzade:",
      "“Namusumun üzerine söz veriyorum ki gömmem. Ölünceye kadar kendi odamda saklarım,” der. Kırk-Haramiler tabutu verirler.",
      "Şehzade alır bu emaneti, odasına koyar. Ama merak da eder. Bir de açar bakar ki, ne görsün, ne görsün, dünya güzeli bir kız. Mum gibi sararmış, güzelliğinden zerre kaybetmemiş. Oğlan deli olur. Kızı kaldırır, köşeye oturtur. O günden sonra, kapıyı kilitler; kimseyi içeri koymazmış. Akşamüstü odasına güle güle güle girermiş, sabahleyin ağlaya ağlaya çıkarmış. Bir lalası varmış oğlanın, dikkat eder, bu oğlan gün günden sararıyor, yemiyor, içmiyor. Merak eder. Çilingirden bir anahtar uydurur kapıya. Bir gün girer içeri. Bakar ki ayın on dördü gibi bir kız, sapsarı, cansız yatıyor. Ama ölüye benzemiyor. İhtiyar adam, tecrübeli ne olsa, anlar ki bu sağdır. Orasını eller, burasını eller. Bir de bakar ki avurdunda sert bir şey. Sokar parmağını, çıkarır, bir sakız. O saat kız: “ Hapişuuuu, hapişuuuu…”diye aksıraraktan uyanır, gözlerini açar, bakar ki başucunda yabancı birisi.",
      "“Aman, burası neresi? Kardeşlerim nerede? Kuşlarım nerede? … “ diye başlar ağlamaya…",
      "Hemen lala koşar Beyin oğluna:",
      "“Müjde, müjde, Şehzadem, der, senin hastan dirildi.”",
      "Şehzade gelir bakar, kız sahiden de dirilmiş ağlıyor… Artık sevincinden çılgına döner.",
      "Hemen Kırk- Haramilere haber gönderir. Onlar da gelirler, sevinirler, bayram ederler.",
      "Sonra, beyoğlu ile Nardaniye Hanım kırk gün kırk gece düğün yapıp evlenirler. Beyin oğlu kızın başından geçenleri dinler. Babasını getirtir. Adamcağız, kederinden bir kara top olmuş… Beyoğlu sorar:",
      "“Derdin nedir, babacığım?”",
      "“Ah, der adam, derdimi nasıl anlatayım, çaresiz dert…”",
      "Kızını dağ başına bıraktığını anlatır.",
      "“Niçin yaptın bu işi?” derler. O da:",
      "“Böyle böyle, kızım gezmeye gitmişti… Bir kaza gelmiş başına, namusuma yediremedim,” der.",
      "Kızı çağırırlar. Baba kız birbirlerinin boynuna atılırlar… Kız başından geçenleri bir bir anlatır. Hemen giderler, analığı getirirler. Beyin önüne. Ona derler ki:",
      "“Kırk satır mı istersin, kırk katır mı?” Kadın da:",
      "“Kırk satır düşman başına, der. Kırk katır verin de sılama gideyim.”",
      "O zaman, kadını kırk katırın kuyruğuna bağlarlar, kırkına bir kamçı vururlar. Üvey ana da yaptıklarının cezasını bulur… Onlar ermiş muradına, bizde erelim muradımıza…"

      "Varmış, yokmuş Allah'ın kulu çokmuş. Çok söylemesi günah, söyleneni dinlememek çok ayıpmış.",
      "Vaktin birinde, bir memleketin bir padişahı varmış. Padişahın da bir tanecik oğlu varmış. Günlerden bir gün bu şehzade balkona çıkmış. Balkondan şehrin orta yerindeki pınar görünürmüş. Şehzade balkondan pınara gelip su dolduran kadınları gözlemiş. Bir tane yaşlı kadın da su doldurmaya gelmiş. Şehzade bir taş alıp atmış. Yaşlı kadının testisini kırmış. Yaşlı kadın şehzadeye dönmüş:",

      "“İnsanoğlu” demiş, “bana bugün iki büyük iyilik ettin. Birinci yavrularımı kurtarıp bana bağışladın. Sonra beni acıdan kıvrandıran ayağımdaki yarayı temizleyip iyileştirdin. Sana nasıl yardım edeyim?” diye sormuş. Şehzade:",

      "“Şimdi bu dağı aşacaksın bunun arkasında bundan daha yüce bir dağ var onu da aşacaksın. Onun arkasındaki daha da yüce. İşte o dağın tepesine çık. Tepede büyük bir devin büyük bir kalesi var. Kalenin bir kapısı açık, biri kapalı, Bir kapıda bir köpek bağlı, birinde koyun. Koyunun önünde et var, köpeğin önünde de ot. Kale kapısına gelince koyunun önündeki eti köpeğe ver, köpeğin önündeki otu da koyuna. Kalenin açık kapısını kapat, kapalı kapısını aç ve içeri gir. Yolun her tarafı böğürtlenlerle dolu. Böğürtlenlerin dikenleri yoluna devam ettirmeyecekler seni. Sen böğürtlenleri elinle okşa ve “Oh! Ne güzel güllermiş” de, böğürtlenler sana yol verecekler, bir ağacın altında bir dev göreceksin. Devin gözleri yumuksa, bil ki uyanık, sesini çıkarma, gözleri açıksa da dev uyumuştur. Ağacın başında üç tane turunç var. Yerden bir taş al, Bismillah, de taşı at. Üç seferde düşüremezsen taş kesileceksin. Oradan çıkarken de sakın arkana bakma. Turunçları da su kenarında kes,” demiş. Şehzade helâlaşıp yola koyulmuş.",
      "O dağı aşmış. Ardından ondan daha yüce bir dağı aşmış. Derken üç turunçların bulunduğu hepsinden yüce dağa gelmiş. Dağın tepesine varmış. Bakmış büyük bir kale var. Kalenin iki kapısından biri açık biri kapalı. Kapılardan birinin önünde bir koyun, koyunun önünde de bir parça et duruyormuş. Bir kapının önünde de bir köpek yatıyormuş, köpeğin önünde bir kucak ot varmış. Koyunun önünden eti almış, ite vermiş, itin önündeki otu da koyuna vermiş, Kalenin açık kapısını kapatmış, kapalı kapısını açıp içeriye girmiş. Bakmış her taraf böğürtlen. Bir girmiş böğürtlenlerin içine. Dikenler her yanını kanatmış. Aslanın dediklerini hatırlamış ve böğürtlenleri okşamış.",

      "“Ben ne güzelmişim de haberim yokmuş, demiş. Padişaha gelin olacak kadar güzelim” demiş. Elini saçına götürüp düzeltmek istemiş. Bakmış göldeki aksi elini kaldırmıyor. Şaşmış kalmış. Sağa sola bakmış ağacın üstündeki turunç güzelini görmüş. Sinsen kızı:",
      "“Bacı, bacı” demiş. “Niye öyle ağacın tepesinde oturuyorsun. İn aşağıda iki laf edelim, demiş.",

const settings = {theme: 'sepia', size: 21};

const collection = document.getElementById('collection');
const reader = document.getElementById('reader');

function applySettings() {
  document.documentElement.dataset.theme = settings.theme;
  document.documentElement.style.setProperty('--size', settings.size + 'px');
  document.querySelectorAll('.tema-dugmesi').forEach(button => {
    button.setAttribute('aria-pressed', button.dataset.value === settings.theme);
  });
  document.getElementById('font-size').textContent = settings.size + ' px';
  document.getElementById('smaller').disabled = settings.size <= 14;
  document.getElementById('larger').disabled = settings.size >= 29;
}

document.querySelectorAll('.tema-dugmesi').forEach(button => {
  button.addEventListener('click', () => {
    settings.theme = button.dataset.value;
    applySettings();
  });
});

document.getElementById('smaller').addEventListener('click', () => {
  settings.size = Math.max(14, settings.size - 2);
  applySettings();
});

document.getElementById('larger').addEventListener('click', () => {
  settings.size = Math.min(29, settings.size + 2);
  applySettings();
});

  document.getElementById('story-intro').textContent = story.intro;
  document.getElementById('reader-position').textContent =
    String(index + 1).padStart(2, '0') + ' / ' + total + ' masal';
  document.getElementById('story-body').innerHTML =
    story.paragraphs.map(text => `<p>${text}</p>`).join('');
  document.getElementById('source-note').textContent = story.sourceNote;
  document.getElementById('source-link').href = story.source;
  document.getElementById('source-link').textContent = story.sourceName + ' ↗';
  reader.querySelector('details').open = false;

  let links = '';
  if (previous) {
    links += `<a class="onceki" href="#masal/${previous.id}"><small>Önceki masal</small>${previous.title}</a>`;
  }
  if (next) {
    links += `<a class="sonraki" href="#masal/${next.id}"><small>Sonraki masal</small>${next.title} →</a>`;
  }
  document.getElementById('reader-nav').innerHTML = links;
  document.title = story.title + ' · Kayıp Rıhtım';
}

function route() {
  const hash = location.hash;
  const index = stories.findIndex(story => hash === '#masal/' + story.id);

  collection.hidden = index !== -1;
  reader.hidden = index === -1;

  if (index !== -1) {
    showStory(index);
  } else {
    document.title = 'Kayıp Rıhtım · Türk Masalları';
  }
  window.scrollTo({top: 0, behavior: 'instant'});
}

window.addEventListener('hashchange', route);

applySettings();
route();
</script>
</body>
</html>
